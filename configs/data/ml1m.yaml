name: ml1m
download:
  url: https://files.grouplens.org/datasets/movielens/ml-1m.zip
  md5: c4d9eecfca2ab87c1945afe126590906  # published at <url>.md5 by GroupLens
  raw_dir: data/raw
  ratings_member: ml-1m/ratings.dat
preprocess:
  rating_threshold: 4   # rating >= threshold -> positive implicit interaction
  k_core: 5             # users and items, applied iteratively until stable
split:
  train: 0.8
  val: 0.1
  test: 0.1
  tie_break_seed: 0   # same-timestamp interactions of a user are ordered randomly with this seed
head_fraction: 0.2      # head items = top 20% by train popularity
processed_dir: data/processed/ml1m
