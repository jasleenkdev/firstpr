name: recbole_lightgcn
params:                    # RecBole LightGCN through the bridge: reference check for our lightgcn
  embedding_size: 64
  n_layers: 3              # same as our main lightgcn (RecBole default is 2)
  require_pow: true        # squared L2 / batch / 2 on layer-0 embeddings, the same form as ours
  reg_weight: 0.0001
  learning_rate: 0.005
  train_batch_size: 8192   # same CPU compromise as our lightgcn
  train_neg_sample_args: {distribution: uniform, sample_num: 1}
  epochs: 400
  stopping_step: 10
  min_epochs: 30           # bridge guard: no early stop before this (popularity plateau)
  eval_step: 1
  eval_batch_size: 4096
search:                    # same grid as our lightgcn; only init differs (RecBole: Xavier uniform)
  # grid 1 lr {2e-3, 5e-3, 1e-2} x reg {1e-4, 1e-3, 1e-2}: lower reg edge again -> reg 1e-5 added,
  # worst row lr 2e-3 dropped (same extension as our lightgcn); best moved to lr 1e-2 / reg 1e-3
  # (upper lr edge, +1.3% over lr 5e-3) -> lr 2e-2 added
  learning_rate: [0.005, 0.01, 0.02]
  reg_weight: [0.00001, 0.0001, 0.001, 0.01]
