name: refresh serving data

# Daily: open beginner issues of catalog repos and new repos (GitHub GraphQL), LLM features
# within the Groq free tier, uploaded to the Hugging Face dataset the API reads hourly.
# No BigQuery here: retraining on GH Archive is a manual, at most monthly job.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: refresh issues, fresh repos and llm features
        run: uv run --no-dev python scripts/refresh_serving.py --source hub --llm-minutes 40 --upload
        env:
          GITHUB_TOKEN: ${{ secrets.FIRSTPR_GH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
