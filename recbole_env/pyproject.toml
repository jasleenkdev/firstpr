[project]
name = "firstpr-recbole-env"
version = "0.1.0"
description = "Isolated environment for running RecBole models on the FirstPR split"
requires-python = ">=3.11,<3.12"
# RecBole 1.2.1 breaks on numpy 2 (np.bool8), pandas 3 (copy-on-write), torch >= 2.6
# (torch.load weights_only default) and scipy >= 1.12 (dok_matrix._update); these pins work.
dependencies = [
    "recbole==1.2.1",
    "torch==2.5.1",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "pandas==2.2.3",
    "setuptools<81",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
