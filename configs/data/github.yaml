name: github
source: github          # GH Archive (BigQuery) events + GitHub GraphQL metadata; see src/firstpr/github/
github_dir: data/github # raw downloads, caches, ledger (gitignored)
windows:                # global temporal split (UTC, end exclusive)
  train_start: "2025-03-01"
  val_start: "2025-09-01"
  test_start: "2025-10-01"   # Hacktoberfest month = phase 7 replay month
  test_end: "2025-11-01"
bigquery:
  max_gb_per_query: 200      # server-side cap per query
  monthly_budget_gb: 900     # sandbox gives 1 TB/month; 100 GB margin
bot_regex: '(\[bot\]$|bot$|-ci$|^dependabot|^renovate|^github-actions)'
beginner_labels:        # matched case-insensitively against label names (GraphQL check)
  - good first issue
  - good-first-issue
  - good first contribution
  - first-timers-only
  - first timers only
  - beginner
  - beginner friendly
  - beginner-friendly
  - help wanted
  - easy
  - starter
scoping:
  min_actors: 20             # repos returned by the activity query (distinct external actors)
  candidate_min_contrib: 10  # beginner check only for repos with >= 10 external contributors
  max_candidates: 30000      # GraphQL check budget (most contributors first)
  max_beginner: 6000         # beginner repos kept (most external contributors first)
  broad_min_shared: 30       # broad repos: >= 30 actors shared with beginner repos
  max_broad: 3000
  cold_min_actors: 20        # new repos (created on/after val_start) active in val/test
  max_cold: 500
preprocess:
  types: [star, fork, pr, issue, comment, review]   # interaction kinds kept (binary, first touch)
  k_core: 5                  # iterative, on train pairs only (users and items)
  max_user_items: 1000       # users touching more repos in the window are dropped (star farms)
split:
  tie_break_seed: 0          # same-second events of a user ordered randomly (seeded)
  contrib_variant: true      # also write <processed_dir>_contrib: same train, val/test targets
                             # restricted to pairs with a PR / issue / comment / review
item_text:
  readme_max_chars: 1500     # cleaned README (scrub_text) used for the text encoder
  description_max_chars: 300
head_fraction: 0.2
disk:
  max_data_gb: 20
  warn_free_gb: 30
processed_dir: data/processed/github
