name: itemknn
params:          # defaults; the tuned config is written to results/best/itemknn_<dataset>.yaml
  k: 100         # neighbours kept per target item
  shrink: 10     # shrinkage term in the cosine denominator
search:          # grid tuned on val NDCG@20 (Dacrema et al., RecSys 2019: tune baselines properly)
  k: [20, 50, 100, 200]
  shrink: [0, 10, 50, 100]
