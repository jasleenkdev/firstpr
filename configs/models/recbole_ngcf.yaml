name: recbole_ngcf
params:                      # NGCF (Wang et al., SIGIR 2019) via the RecBole bridge
  embedding_size: 64
  hidden_size_list: [64, 64, 64]   # 3 propagation layers, like lightgcn
  node_dropout: 0.0
  message_dropout: 0.1       # paper / RecBole default
  reg_weight: 0.00001        # RecBole default L2 on embeddings
  learning_rate: 0.001
  train_batch_size: 8192     # same CPU compromise as lightgcn
  train_neg_sample_args: {distribution: uniform, sample_num: 1}
  epochs: 400
  stopping_step: 10
  eval_step: 1
  eval_batch_size: 4096
search:
  learning_rate: [0.001, 0.005]
  reg_weight: [0.00001, 0.0001, 0.001]
