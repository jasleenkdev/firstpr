name: lightgcn
params:                 # LightGCN (He et al., SIGIR 2020), own implementation
  dim: 64               # paper
  n_layers: 3           # paper's usual best; layers 1-4 are an ablation (lightgcn_l1..l4)
  init_std: 0.1         # paper code: N(0, 0.1)
  lr: 0.005             # Adam (paper 1e-3 at batch 2048; ~4e-3 at our 4x batch)
  reg: 0.0001           # L2 on layer-0 batch embeddings (paper 1e-4)
  batch_size: 8192      # paper 2048; 4x larger for CPU (full-graph propagation per batch), lr grid widened
  max_epochs: 400
  patience: 10
  min_epochs: 30        # no early stop before this: LightGCN starts on a popularity plateau
  eval_every: 1
search:   # lr 1e-3 dropped: at batch 8192 it sat on the popularity plateau (val 0.063) past patience
  # grid history (val only): 1) lr {2e-3, 5e-3, 1e-2} x reg {1e-4, 1e-3, 1e-2} -> best lr 5e-3 /
  # reg 1e-4 (lower reg edge, +3.8% over reg 1e-3) -> reg 1e-5 added; lr 2e-3 was the worst row
  # at every reg, so it is dropped
  lr: [0.005, 0.01]
  reg: [0.00001, 0.0001, 0.001, 0.01]
search_extend:
  amazon_sci:           # grid 1 best lr 1e-2 / reg 1e-3 (lr edge, +1.2%) -> lr 2e-2 added
    lr: [0.02]
search_override:        # GitHub: reg over 3 orders; lr 1e-4 left out (phase 3: lr <= 1e-3 at
  github:               # batch 8192 stays on the popularity plateau and burns the epoch budget)
    lr: [0.001, 0.01, 0.1]
    reg: [0.00001, 0.0001, 0.001, 0.01]
search_points:          # refinement round (val only): half-decade neighbours of lr 1e-2 / reg 1e-3
  github:
    - {lr: 0.003, reg: 0.001}
    - {lr: 0.03, reg: 0.001}
    - {lr: 0.01, reg: 0.0003}
    - {lr: 0.01, reg: 0.003}
    # round 2 (best moved >= 1% to lr 3e-3 / reg 1e-3): its missing reg neighbours
    - {lr: 0.003, reg: 0.0003}
    - {lr: 0.003, reg: 0.003}
