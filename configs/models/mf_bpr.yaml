name: mf_bpr
params:
  dim: 64            # embedding size (common default in NCF / LightGCN comparisons)
  init_std: 0.1      # N(0, 0.1) init, as in the LightGCN PyTorch reference code
  lr: 0.001          # Adam
  reg: 0.0001        # L2 on batch embeddings
  batch_size: 4096
  max_epochs: 300
  patience: 10       # evaluations without val NDCG@20 improvement before stopping
  eval_every: 1
search:
  # grid history (all decided on val only; finished configs are reused, not re-run):
  # 1) lr {1e-3, 5e-3} x reg {1e-5, 1e-4, 1e-3} -> best lr=1e-3, reg=1e-3 (corner)
  # 2) added lr 5e-4 and reg {3e-3, 1e-2} -> best lr=5e-3, reg=1e-2 (corner again);
  #    lr=5e-4 was the worst row at every reg, so it is dropped below
  # 3) current grid: extends reg to 1e-1 and lr to 1e-2
  lr: [0.001, 0.005, 0.01]
  reg: [0.00001, 0.0001, 0.001, 0.003, 0.01, 0.03, 0.1]
search_extend:
  amazon_sci:           # sparse data: reg <= 1e-2 ends at or below Popularity; best so far at
    reg: [0.3, 1.0]     # the top reg edge (0.1, +15% over 0.03) -> extended (val only)
    lr: [0.02]          # then lr 1e-2 / reg 3e-2 won at the top lr edge (+4.9%) -> extended
search_override:        # GitHub: decades over 3 orders of magnitude, refined later (val only)
  github:
    lr: [0.0001, 0.001, 0.01, 0.1]
    reg: [0.0001, 0.001, 0.01, 0.1]
