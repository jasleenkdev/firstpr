name: recbole_bpr
params:                    # RecBole BPR through the bridge: validates the bridge against our MF-BPR
  embedding_size: 64
  learning_rate: 0.005
  weight_decay: 0.0        # RecBole applies this as Adam weight decay on all parameters
  train_batch_size: 4096
  train_neg_sample_args: {distribution: uniform, sample_num: 1}
  epochs: 300
  stopping_step: 10        # RecBole early stopping on NDCG@20 over our val split
  eval_step: 1
  eval_batch_size: 4096
search:   # grid 1 -> lr 1e-3 (lower edge) / weight_decay 0; wd 1e-4 collapses (~0.064, whole-table
  # decay starves rare rows) -> extended lr down and wd between 0 and 1e-4 (val only)
  learning_rate: [0.00025, 0.0005, 0.001, 0.005]  # grid 2 -> lr 5e-4 (edge) -> 2.5e-4 added
  weight_decay: [0.0, 0.000001, 0.00001, 0.0001]
