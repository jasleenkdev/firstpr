name: sasrec
params:                 # SASRec (Kang & McAuley, ICDM 2018), own implementation
  max_len: 200          # paper's ML-1M setting
  hidden: 64            # paper uses 50; 64 matches the other models
  blocks: 2             # paper
  heads: 1              # paper
  dropout: 0.2          # paper's ML-1M setting
  lr: 0.001             # Adam, betas (0.9, 0.98) as in the paper
  batch_size: 128       # sequences per batch (paper)
  loss: ce              # full-catalog cross-entropy (Klenitskiy & Vasilev 2023); "bce" = paper
  shuffle_history: false
  max_epochs: 150
  patience: 10
  eval_every: 1
search:
  # grid 1 (lr {5e-4,1e-3} x dropout {0.2,0.5}) -> lr 1e-3 / dropout 0.2 (edge on both) -> extended
  # (val only). max_epochs 150 is a fixed training budget for every config; lr 5e-4 hit it
  # (best epoch 141), i.e. lower lrs are budget-limited under this protocol.
  lr: [0.0005, 0.001, 0.002, 0.005]  # grid 2 -> lr 2e-3 (edge) -> 5e-3 added
  dropout: [0.1, 0.2, 0.5]
params_override:        # per-dataset defaults (part of the tuned config on that dataset only)
  amazon_sci:
    max_len: 50         # Amazon histories: median 7, max 115 train items; 200 was 4x slower
