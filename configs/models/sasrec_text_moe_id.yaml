name: sasrec_text_moe_id
params:                 # SASRec over frozen text embeddings + moe adapter (use_id: true)
  text_encoder: BAAI/bge-small-en-v1.5
  adapter: moe
  use_id: true      # false = text only (inductive, UniSRec); true = text + ID (transductive)
  max_len: 50           # Amazon histories: median 7, max 115 train items
  hidden: 64
  blocks: 2
  heads: 1
  dropout: 0.2
  lr: 0.001
  batch_size: 128
  max_epochs: 150
  patience: 10
  eval_every: 1
search:
  lr: [0.001, 0.002, 0.005]
  dropout: [0.2, 0.5]
