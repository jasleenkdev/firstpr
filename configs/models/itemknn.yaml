name: itemknn
params:          # defaults; the tuned config is written to results/best/itemknn_<dataset>.yaml
  k: 100         # neighbours kept per target item
  shrink: 10     # shrinkage term in the cosine denominator
search:          # grid tuned on val NDCG@20 (Dacrema et al., RecSys 2019: tune baselines properly)
  k: [20, 50, 100, 200]
  shrink: [0, 10, 50, 100]
search_extend:          # per-dataset edge extensions (val only)
  amazon_sci:           # grid 1 best k=200/shrink=100 (shrink edge +2.2%; k edge +0.7% -> stop)
    shrink: [200, 500]
search_override:        # GitHub: wide log-spaced initial grid (3 orders of magnitude each)
  github:
    k: [10, 30, 100, 300, 1000]
    shrink: [0, 1, 10, 100, 1000]
search_points:          # refinement round (val only): half-step neighbours of the grid best
  github:               # (k 1000 / shrink 10)
    - {k: 3000, shrink: 10}
    - {k: 1000, shrink: 3}
    - {k: 1000, shrink: 30}
